<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Population Density Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="controls">
    <div id="state-selector"></div>
    <div id="time-controls">
      <label for="year-slider">Year:</label>
      <input type="range" id="year-slider" min="2000" max="2024" value="2020" step="0.1">
      <span id="year-display">2020</span>
    </div>
    <div id="legend">
      <div id="legend-bar"></div>
      <div id="legend-labels">
        <span>1</span>
        <span>10</span>
        <span>100</span>
        <span>1K</span>
        <span>10K</span>
        <span>50K+</span>
      </div>
    </div>
    <label id="sync-toggle">
      <input type="checkbox" id="zoom-sync"> Sync zoom
    </label>
  </div>
  <div id="map-grid"></div>
  <div id="tract-tooltip" class="tract-tooltip" style="display: none;"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
